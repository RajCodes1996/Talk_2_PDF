<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Talk 2 PDF</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1rem;
    }
    .container {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    header {
      text-align: center;
      margin-bottom: 0.5rem;
    }
    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #60a5fa, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.subtitle {
      color: var(--text-muted);
      margin-top: 0.3rem;
      font-size: 1rem;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }
    h2 {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .upload-row {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      flex-wrap: wrap;
    }
    input[type="file"] {
      flex: 1;
      padding: 0.5rem;
      background: #0f172a;
      border: 1px dashed var(--border);
      border-radius: 8px;
      color: var(--text-muted);
      cursor: pointer;
    }
    input[type="text"] {
      flex: 1;
      padding: 0.75rem 1rem;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: var(--primary);
    }
    button {
      padding: 0.75rem 1.4rem;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    button:hover {
      background: var(--primary-hover);
    }
    button:active {
      transform: scale(0.98);
    }
    .badge {
      display: inline-block;
      margin-top: 0.75rem;
      font-size: 0.85rem;
      color: var(--success);
      font-weight: 500;
    }
    .question-row {
      display: flex;
      gap: 0.75rem;
    }
    .answer-card {
      margin-top: 1rem;
      padding: 1.25rem;
      background: #090d16;
      border: 1px solid #1e3a8a;
      border-radius: 8px;
      line-height: 1.6;
      font-size: 1.05rem;
      color: #f1f5f9;
      min-height: 4rem;
      display: none;
    }
    .meta-box {
      margin-top: 0.75rem;
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      gap: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Talk 2 PDF</h1>
      <p class="subtitle">Offline Extractive QA & Reader Engine</p>
    </header>

    <div class="card">
      <h2>1. Document Ingestion</h2>
      <div class="upload-row">
        <input type="file" id="pdfFile" accept=".pdf" />
        <button id="uploadBtn">Upload</button>
      </div>
      <div id="uploadResult" class="badge"></div>
    </div>

    <div class="card" id="question-section" style="display:none;">
      <h2>2. Ask a Question</h2>
      <div class="question-row">
        <input type="text" id="questionInput" placeholder="e.g. what is Diligence? or Summarize the document" />
        <button id="askBtn">Ask</button>
      </div>
      <div id="answerBox" class="answer-card"></div>
      <div id="metaBox" class="meta-box"></div>
    </div>
  </div>

  <script src="/static/js/app.js?v=2"></script>
</body>
</html>
